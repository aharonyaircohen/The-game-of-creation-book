<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ef">
  <title>{{ page.title }} · {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script defer src="{{ '/assets/reader.js' | relative_url }}"></script>
</head>
<body>
  <div class="reading-progress" aria-hidden="true"><span id="progressBar"></span></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="book-name" href="{{ '/' | relative_url }}">משחק היצירה</a>
      <div class="reader-controls" aria-label="אפשרויות קריאה">
        <button type="button" data-font="down" aria-label="הקטנת טקסט">א−</button>
        <button type="button" data-font="up" aria-label="הגדלת טקסט">א+</button>
        <button type="button" id="themeToggle" aria-label="החלפת מצב תצוגה">◐</button>
      </div>
    </div>
  </header>

  <main class="reader-shell">
    <article class="reader-content">
      <p class="edition">גרסה ראשונה</p>
      <h1>{{ page.title }}</h1>
      {{ content }}
    </article>

    <nav class="chapter-nav" aria-label="ניווט בין חלקי הספר">
      {% if page.prev_url %}
      <a class="chapter-nav-link prev" href="{{ page.prev_url | relative_url }}">
        <span>הקודם</span>
        <strong>{{ page.prev_title }}</strong>
      </a>
      {% else %}
      <span></span>
      {% endif %}
      {% if page.next_url %}
      <a class="chapter-nav-link next" href="{{ page.next_url | relative_url }}">
        <span>הבא</span>
        <strong>{{ page.next_title }}</strong>
      </a>
      {% endif %}
    </nav>
  </main>
</body>
</html>
